# polycode-hub 配置示例（v0.4：Source / Provider / 模型目录 / 三协议）
# 复制为 config/apps.yaml 并按需修改（POLYCODE_CONFIG 可覆盖路径）
#
# 硬规则（docs/upstream-providers.md §2.1）：
#   1. 一个 Provider 只说一种协议（api 字段）；同一网关提供两种协议 → 建两个 Provider
#   2. Provider ID 永久不可改（改名 = 新建 + 删旧），取名一次到位
#   3. baseURL 停在操作路径之前：anthropic-messages 不含 /v1，openai 两种含 /v1
#   4. 凭据不落明文：只存引用（api_key_env 或 api_key_file），密钥放环境变量或
#      config/credentials/ 下文件（0600，已 gitignore）
#   5. 热轮换：api_key_file 改内容即生效（免重启）+ recheck 清冷却；
#      api_key_env 改值需重启；增删改账号/源走 Admin API 即时生效（见 docs/admin-api.md）

gateway:
  host: "127.0.0.1"            # 默认只监听本机；公网暴露须自行评估 TLS + 强令牌
  port: 3000
  admin_key: "changeme"        # 后台 /admin 与 /admin/api/* 的访问口令（必填）
  gateway_key: ""              # client 面 Bearer 鉴权；留空 = 不校验
  default_model: "glm-5.2"     # client 未指定 model 时的默认模型
  risk_max: "high"             # 调度风险上限: low | medium | high（high = 不过滤）
  precheck_context: false      # 上下文预检开关；默认关。开启后超限拒绝+换 Provider，绝不截断

data_dir: "data"               # SQLite 用量与状态落盘目录

# 上游服务 / harness（ZCode、OpenCode、公司自建……）
# 接入方式实例（一个 Source 可有多个 Provider；风险是一等调度维度，UI 必须显示徽章与说明）
providers:
  - name: "company-anthropic"
    display_name: "公司 Anthropic 兼容网关"
    access_kind: "official"      # official | session-reuse | simulated-login | reverse
    risk: "low"
    stability: "stable"          # stable | beta | experimental
    api: "anthropic-messages"    # anthropic-messages | openai-completions | openai-responses
    base_url: "https://gw.example.com"   # anthropic-messages: 不含 /v1，由网关拼 /v1/messages
    credential:
      api_key_env: "COMPANY_GW_KEY"      # 密钥放环境变量，配置不落明文
    priority: 1
    # 同源多账号按 weight 加权轮询（账号页可调，默认 1）；关/失效的账号权重自动失效。
    models:                       # 模型目录：可探测补全，也可手动添加（manual: true）
      - id: "claude-sonnet-4-6"
        display_name: "Claude Sonnet 4.6"
        context_window: 200000    # 未知则不填 → 放行 + warn（默认不做预检）
        max_output_tokens: 8192
        input: [text]             # 纯文本；支持图片须显式 [text, image]
        # reasoning_effort: "high"  # 模型级推理强度预设（强制覆盖客户端档位；不填=跟随客户端）
        enabled: true

  # 同一上游若还讲 openai-completions 协议，另建一个 Provider（base_url 含 /v1）：
  # - id: "company-openai"
  #   api: "openai-completions"
  #   base_url: "https://gw.example.com/v1"   # openai 系: 含 /v1，网关拼 chat/completions
  #   credential: { api_key_env: "COMPANY_GW_KEY" }

# 账号池（同一上游源多账号轮换；凭据只存引用，文件优先、环境变量备选）
accounts: []
#  - id: "zcode-1"
#    display_name: "主号"
#    credential:
#      api_key_file: "config/credentials/zcode-jwt"  # 推荐：本目录文件（已 gitignore），改内容即热轮换
#      # api_key_env: "ZCODE_JWT"                    # 备选：环境变量（改值需重启 serve）

